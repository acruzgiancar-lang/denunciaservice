spring.application.name=denunciaservice

# Puerto local 8080. En Render se usa la variable PORT.
server.port=${PORT:8080}

# Credenciales de MySQL/MariaDB. No se guardan secretos reales en el repositorio.
# Valores locales tomados de phpMyAdmin (XAMPP): usuario root y contraseña vacía.
# Para cambiarlos sin editar este archivo:
#   PowerShell: $env:DB_USERNAME="root"; $env:DB_PASSWORD="tu_clave"
#   CMD:        set DB_PASSWORD=tu_clave
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/examen_denuncias?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update: crea o altera tablas si hace falta, sin borrar registros existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
